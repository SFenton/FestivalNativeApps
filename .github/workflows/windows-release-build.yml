name: windows-release-build
# Build the unsigned Microsoft Store MSIX for one `windows/v<YYMM.DD.NN>` version tag (MSIX version
# YYMM.<DD*100+NN>.<run number>.0) and keep it as an artifact. Only version-bump.yml dispatches it (an app change merged
# to master). The build generates the in-app What's New (WhatsNew.json) and the Store release notes
# (build.json `store_notes`, preferred by `fst_store.py submit`) against the version the public Store listing serves
# (store-baseline job), so they list only what changed since the last Store release. windows-flight.yml then submits it to the
# "Testers" package flight (the Windows TestFlight); the release orchestrator submits the newest CI-passing build
# for public certification on Thursday (`fst_store.py windows submit`), from its `fst-windows-msix_<version>_<sha>`
# artifact. While
# windows/store-identity.json still holds placeholders the artifact is suffixed `_placeholder` and is
# never submitted (packaging check only).
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Version tag to build (windows/vYYMM.DD.NN); empty = the newest windows/v* tag
        type: string
        default: ''
permissions:
  contents: read
jobs:
  store-baseline:
    # The What's New baseline: the release version the public Store listing serves (Partner Center's last published
    # submission; GETs only), like iOS reading App Store Connect. Store credentials stay in this Linux job; the build
    # job only receives the version. No credentials (environment not configured) falls back to released tags; a Store
    # error fails the run rather than shipping a What's New that lists everything since the first version (#670).
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: store-release
    outputs:
      released: ${{ steps.store.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/release
      - name: Published Store version
        id: store
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_APP_ID: ${{ secrets.MSSTORE_APP_ID }}
        run: |
          set +e -uo pipefail
          for attempt in 1 2 3; do
            python3 tools/release/fst_store.py released-versions --json > "$RUNNER_TEMP/released.json"
            code=$?
            if [ "$code" -eq 0 ] || [ "$code" -eq 4 ]; then break; fi
            sleep $((attempt * 20))
          done
          cat "$RUNNER_TEMP/released.json"
          if [ "$code" -eq 4 ]; then
            echo "::warning::No Store credentials: What's New uses only windows/released tags as its baseline"
            echo "released=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::cannot read the published version from Partner Center (exit $code)"; exit 1
          fi
          released=$(python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["released"]))' "$RUNNER_TEMP/released.json")
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "### What's New baseline: Store release ${released:-none}" >> "$GITHUB_STEP_SUMMARY"
  windows-release-build:
    needs: store-baseline
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 60
    # Only the build is serialized: a wedged environment deployment in store-baseline must not hold later builds.
    concurrency:
      group: windows-release-build
      cancel-in-progress: false
    env:
      # Windows Python defaults to cp1252 for text files; notes and WhatsNew.json must stay UTF-8.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: release notes span the commits since the previous version tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version and What's New
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          STORE_RELEASED: ${{ needs.store-baseline.outputs.released }}
        run: |
          set -euo pipefail
          tag="${VERSION_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(python tools/release/versioning.py latest-tag --platform windows | python -c 'import json,sys; print(json.load(sys.stdin)["tag"] or "")')
          fi
          if ! printf '%s' "$tag" | grep -Eq '^windows/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::invalid or missing windows version tag '$tag' (run version-bump first)"; exit 2
          fi
          git -c advice.detachedHead=false checkout -q "refs/tags/$tag"
          msix=$(python tools/release/versioning.py describe --tag "$tag" --build "$GITHUB_RUN_NUMBER" | python -c 'import json,sys; print(json.load(sys.stdin)["msix_version"])')
          mkdir -p "$RUNNER_TEMP/notes"
          # Released versions: the Store's published version (store-baseline) plus windows/released/<version> tags
          # (written by the tracker when it observes a release). The newest one older than $tag is the baseline.
          python tools/release/versioning.py whats-new --tag "$tag" --released "${STORE_RELEASED:-}" --released-from-tags \
            --out windows/Festival.Core/WhatsNew.json --store-notes-out "$RUNNER_TEMP/notes/store-notes.txt"
          { echo "FST_VERSION_TAG=$tag"; echo "FST_VERSION=${tag#windows/v}"; echo "FST_MSIX_VERSION=$msix"; } >> "$GITHUB_ENV"
          echo "Building $tag as MSIX $msix at $(git rev-parse HEAD)"
      - name: Store logos are current
        run: python tools/windows/store_assets.py --check
      - name: Unpackaged build still compiles
        run: dotnet build windows/Festival.App/Festival.App.csproj -c Debug -p:Platform=x64 -nologo -clp:NoSummary
      - name: Package MSIX
        shell: pwsh
        run: ./tools/windows/package_msix.ps1 -AllowPlaceholder -Version $env:FST_MSIX_VERSION -DisplayVersion $env:FST_VERSION -OutDir "$env:RUNNER_TEMP\msix"
      - name: Name artifact
        id: meta
        shell: pwsh
        run: |
          $buildFile = "$env:RUNNER_TEMP\msix\build.json"
          $build = Get-Content -Raw -Encoding utf8 $buildFile | ConvertFrom-Json
          $whatsNew = Get-Content -Raw -Encoding utf8 windows/Festival.Core/WhatsNew.json | ConvertFrom-Json
          $build | Add-Member version_tag $env:FST_VERSION_TAG
          $build | Add-Member whats_new_baseline $whatsNew.baseline
          $build | Add-Member store_notes ((Get-Content -Raw -Encoding utf8 "$env:RUNNER_TEMP\notes\store-notes.txt").Trim())
          $build | ConvertTo-Json | Set-Content -Encoding utf8 $buildFile
          $suffix = if ($build.placeholder) { '_placeholder' } else { '' }
          "name=fst-windows-msix_$($build.version)_$($build.sha)$suffix" >> $env:GITHUB_OUTPUT
          "### Windows MSIX $($build.version)$suffix`n``$($build.package)`` from $($build.sha)" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: |
            ${{ runner.temp }}\msix\*.msix
            ${{ runner.temp }}\msix\*.msixupload
            ${{ runner.temp }}\msix\build.json
          if-no-files-found: error
          retention-days: 30
