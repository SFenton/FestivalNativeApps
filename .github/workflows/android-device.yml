name: Android device tests

# Release train: the whole instrumented suite runs only on the weekly releases/YYMM.DD branch, dispatched by the
# release machine (fst-machine releasetrain); pull requests run android-unit.
on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: android-device-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Build app and test APKs
        # ci_gradle.py retries a transient dependency download failure with --refresh-dependencies (#697).
        run: python3 tools/android/ci_gradle.py :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Install the system image (retried; the download sometimes arrives corrupt)
        run: |
          set +o pipefail  # `yes` dies of SIGPIPE once sdkmanager exits
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null
          for attempt in 1 2 3 4; do
            "$sdk" --install 'system-images;android-35;google_apis;x86_64' emulator > /dev/null && break
            echo "sdkmanager attempt $attempt failed; retrying"
            rm -rf "$ANDROID_HOME/system-images/android-35/google_apis/x86_64" "$ANDROID_HOME/.temp"
            sleep 20
            [ "$attempt" = 4 ] && exit 1
          done
      - name: Run the whole instrumented suite
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          # Google APIs 35: the whole suite runs in ~10 min here; the AOSP 34 image (#397's choice for a
          # small subset) ran it 5x slower with 7 failures and a hang (run 37865512668).
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: fst-ci-api-35
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # The runner execs each line on its own (a `trap` doesn't survive), so the logcat dump rides
          # on the test command. ci_settle_emulator.sh wakes and unlocks without injecting keys, closes
          # a foreign ANR dialog (#692: a boot-time "Pixel Launcher isn't responding" returned over every
          # test) and waits until a window has held focus for 20 s, so the first test owns a resumed,
          # focused window. ci_gradle.py retries only a dependency download failure (#697), never a test failure.
          script: |
            bash tools/android/ci_settle_emulator.sh
            python3 tools/android/ci_gradle.py :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.timeout_msec=180000 || (adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/android-device-logcat.txt"; exit 1)
      - name: Upload Android device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
      - name: Upload Android device logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logcat
          if-no-files-found: warn
          path: android-device-logcat.txt
