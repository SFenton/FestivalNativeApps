name: Android device tests

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'contracts/**'
      - '.github/workflows/android-device.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'contracts/**'
      - '.github/workflows/android-device.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Cache Android virtual device
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: android-device-avd-api-35-google-apis-x86_64-v1
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: fst-ci-api-35
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            trap 'adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/android-device-logcat.txt" || true' EXIT
            bash android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload Android device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
      - name: Upload Android device logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logcat
          if-no-files-found: warn
          path: android-device-logcat.txt
