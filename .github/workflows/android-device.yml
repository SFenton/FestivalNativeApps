name: Android device tests

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'tools/android/ci_device.sh'
      - 'contracts/**'
      - '.github/workflows/android-device.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/android/ci_device.sh'
      - 'contracts/**'
      - '.github/workflows/android-device.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-device-leg:
    name: android-device (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: phone
            profile: pixel_6
            expect_fold: false
          - id: fold-half
            profile: pixel_6
            expect_fold: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Cache Android virtual device
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: android-device-avd-api-34-default-x86_64-${{ matrix.id }}-v1
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          avd-name: fst-ci-api-34-${{ matrix.id }}
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/ci_device.sh ${{ matrix.id }} ${{ matrix.expect_fold }}
      - name: Upload Android device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports-${{ matrix.id }}
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
      - name: Upload Android device logcat
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-logcat-${{ matrix.id }}
          if-no-files-found: warn
          path: android-device-${{ matrix.id }}-logcat.txt

  android-device:
    if: always()
    needs: android-device-leg
    runs-on: ubuntu-latest
    steps:
      - name: Require phone and half-open fold legs
        run: test "${{ needs.android-device-leg.result }}" = success
