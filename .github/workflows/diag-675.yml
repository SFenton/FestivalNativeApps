name: diag-675
# TEMPORARY diagnostic for #675 (reverted before the fix lands): why the Leaderboards Lead card's first row is not
# hittable on the hosted xcode-27 iPad (GroupedCardAccessibilityJourneyTests at AX5). v2: the apple-ci iPad sequence first.
on:
  push:
    branches: [report/675]
    paths: ['.github/workflows/diag-675.yml']
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  ipad:
    runs-on: xcode-27
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [full, journeys]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo ln -sfn /Applications/Xcode_27.1.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate
        working-directory: apple
        run: xcodegen generate -q
      - name: Plain-fixture journeys, iPad (apple-ci step)
        if: matrix.variant == 'full'
        env:
          HISTORY_IPAD_JOURNEYS: >-
            ScoreHistoryAccessibilityJourneyTests/testScoreHistoryPageAtAX5
            ScoreHistoryAccessibilityJourneyTests/testScoreHistorySplitPaneAtAX5
            SongBoardSplitAccessibilityJourneyTests/testSongBoardSplitTitleAtAX5
            SongBandBoardSplitAccessibilityJourneyTests/testSongBandBoardSplitLinkAtAX5
            SongDetailCardRowAccessibilityJourneyTests/testInstrumentCardRowAtAX5
            IPadShellAccessibilityTests/testSplitBandStaysOutOfTheTreeUnderIncreaseContrastAtAX5
          MENU_BAR_IPAD_JOURNEYS: >-
            IPadMenuBarJourneyTests/testMenuBarPageToolsAreListedAndDisabledWithoutPageTools
            IPadMenuBarJourneyTests/testItemShopLayoutItemsSwitchThePage
            IPadMenuBarJourneyTests/testBandSizeItemsSwitchTheBoard
            IPadMenuBarJourneyTests/testSelectThisProfileSelectsTheShownPlayer
            IPadMenuBarJourneyTests/testViewRivalsProfileOpensTheRival
            IPadMenuBarJourneyTests/testSuggestionsFilterOpensThePageFilter
        run: |
          log="$RUNNER_TEMP/mock_service_history.log"
          python3 tools/mock_service.py --port 0 > "$log" 2>&1 &
          mock=$!
          trap 'kill "$mock" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do grep -q "fixture service on" "$log" && break; sleep 1; done
          port=$(sed -n 's/.*fixture service on 127\.0\.0\.1:\([0-9]*\).*/\1/p' "$log" | head -n 1)
          export TEST_RUNNER_FST_FIXTURE_URL="http://127.0.0.1:$port"
          ipad=$(python3 tools/ios_sim.py ci-device --type "iPad Pro 11-inch (M5)")
          only=(); for journey in $HISTORY_IPAD_JOURNEYS; do only+=(--only "$journey"); done
          python3 tools/ios_sim.py uitest --app ipad --device "$ipad" --fail-on-skip --retries 1 --timeout 1500 \
            --no-test-diagnostics "${only[@]}" || true
          only=(); for journey in $MENU_BAR_IPAD_JOURNEYS; do only+=(--only "$journey"); done
          python3 tools/ios_sim.py uitest --app ipad --device "$ipad" --fail-on-skip --retries 1 --timeout 1500 --batch-size 1 \
            --no-test-diagnostics "${only[@]}" || true
      - name: iPad simulator journeys (apple-ci list), then GroupedCard with diagnostics
        env:
          JOURNEYS: >-
            DuoSplitBandAccessibilityJourneyTests/testFlatMidpointBandIsAccessibleAtAX5WithMoreContrastDuoUnfolded
            DuoSplitBandAccessibilityJourneyTests/testBookHingeBandIsAccessibleAtAX5WithMoreContrastDuoBook
            WhatsNewAccessibilityJourneyTests/testWhatsNewIsReadableAtAX5Portrait
            WhatsNewAccessibilityJourneyTests/testWhatsNewIsReadableAtAX5Landscape
            BoardFooterFadeJourneyTests/testBoardFooterFadeAtLargestText
            BoardFooterFadeJourneyTests/testBoardFooterFadeAtLargestTextLandscape
            SongLeaderboardEndJourneyTests/testLastRowRestsAboveFooterAtLargestText
            SongLeaderboardEndJourneyTests/testLastRowRestsAboveFooterAtLargestTextLandscape
            WideBoardColumnsJourneyTests/testFullRankingsTwoColumnsAreAccessibleAtLargestText
            WideBoardColumnsJourneyTests/testBandRankingsTwoColumnsAreAccessibleAtLargestText
            SongDetailBandColumnsJourneyTests/testBandPreviewColumnsAreAccessibleAtLargestText
            InCardViewAllAccessibilityJourneyTests/testLeaderboardsViewAllRankingsIsReadableAtAX5
            InCardViewAllAccessibilityJourneyTests/testRivalDetailCategoryViewAllIsReadableAtAX5
            InCardViewAllAccessibilityJourneyTests/testSongPreviewViewFullLeaderboardIsReadableAtAX5
            InCardViewAllAccessibilityJourneyTests/testScoreHistoryViewAllScoresIsReadableAtAX5
            FeedbackSentJourneyTests/testFiledReportClosesFormThenShowsSentAlert
            FeedbackSentJourneyTests/testFiledRequestClosesFormThenShowsSentAlert
            FeedbackSentJourneyTests/testRefusedOrFailedReportKeepsForm
            FeedbackSentJourneyTests/testSubmitSwapsFormForCentredSendingStatus
            PathsDismissAccessibilityJourneyTests/testPathsCloseAndZoomWithoutGestures
            PathsDismissAccessibilityJourneyTests/testPathsCloseAndZoomWithoutGesturesAtAX5
            PathsKaraokeNoticeAccessibilityJourneyTests/testNoticeWaitsForTheHeldPath
            PathsKaraokeNoticeAccessibilityJourneyTests/testNoticeWaitsForTheHeldPathAtAX5
            PathsKaraokeNoticeAccessibilityJourneyTests/testNoticeWaitsForEveryPaneDuoBook
            PageToolsSearchFieldJourneyTests/testSongsToolsSitApartFromTheFilterField
            PageToolsSearchFieldJourneyTests/testSongsToolsSitApartFromTheFilterFieldAtAX5
            PageToolsSearchFieldJourneyTests/testLeaderboardsQuickLinksIsOneIconButton
            SongsChromeJourneyTests/testSectionJumpIsAccessibleAtLargestText
            NotificationsPinnedTitleJourneyTests/testPinnedTitleAndRowsAtLargestText
            QuickLinksIconAccessibilityJourneyTests/testMenuInstrumentIconMatchesSymbolRow
            QuickLinksIconAccessibilityJourneyTests/testMenuInstrumentIconMatchesSymbolRowAtAX5
            GlobalSearchAccessibilityJourneyTests/testSearchTitleStaysReadableAtAX5
        run: |
          python3 tools/mock_service.py --large-catalogue > "$RUNNER_TEMP/mock.log" 2>&1 &
          device=$(python3 tools/ios_sim.py ci-device --type "iPad Pro 11-inch (M5)")
          for _ in $(seq 60); do grep -q "fixture service on" "$RUNNER_TEMP/mock.log" && break; sleep 1; done
          only=(); for journey in $JOURNEYS; do only+=(--only "$journey"); done
          python3 tools/ios_sim.py uitest --device "$device" --app phone --batch-size 1 --fail-on-skip --retries 1 --timeout 1500 \
            --no-test-diagnostics "${only[@]}" || true
          export FST_UITEST_KEEP_RESULTS=1
          python3 tools/ios_sim.py uitest --device "$device" --app phone --batch-size 1 --fail-on-skip --retries 1 \
            --timeout 1500 --only GroupedCardAccessibilityJourneyTests/testLeaderboardsGroupedCardIsReadableAtAX5
      - name: Collect
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for r in apple/DerivedData/lane-driver/Results/*.xcresult; do
            [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path "$RUNNER_TEMP/out/$(basename "$r")-att" || true
            [ -d "$r" ] && xcrun xcresulttool get test-results tests --path "$r" > "$RUNNER_TEMP/out/$(basename "$r").tests.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-675-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
