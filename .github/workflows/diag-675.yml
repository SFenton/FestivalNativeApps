name: diag-675
# TEMPORARY diagnostic for #675 (reverted before the fix lands): why the Leaderboards Lead card's first row is not
# hittable on the hosted xcode-27 iPad (GroupedCardAccessibilityJourneyTests at AX5). v3: GroupedCard after each plain-fixture journey (bisect); reboot between the steps.
on:
  push:
    branches: [report/675]
    paths: ['.github/workflows/diag-675.yml']
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  ipad:
    runs-on: xcode-27
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [probe, reboot]
    env:
      PLAIN: >-
        ScoreHistoryAccessibilityJourneyTests/testScoreHistoryPageAtAX5
        ScoreHistoryAccessibilityJourneyTests/testScoreHistorySplitPaneAtAX5
        SongBoardSplitAccessibilityJourneyTests/testSongBoardSplitTitleAtAX5
        SongBandBoardSplitAccessibilityJourneyTests/testSongBandBoardSplitLinkAtAX5
        SongDetailCardRowAccessibilityJourneyTests/testInstrumentCardRowAtAX5
        IPadShellAccessibilityTests/testSplitBandStaysOutOfTheTreeUnderIncreaseContrastAtAX5
        IPadMenuBarJourneyTests/testMenuBarPageToolsAreListedAndDisabledWithoutPageTools
        IPadMenuBarJourneyTests/testItemShopLayoutItemsSwitchThePage
        IPadMenuBarJourneyTests/testBandSizeItemsSwitchTheBoard
        IPadMenuBarJourneyTests/testSelectThisProfileSelectsTheShownPlayer
        IPadMenuBarJourneyTests/testViewRivalsProfileOpensTheRival
        IPadMenuBarJourneyTests/testSuggestionsFilterOpensThePageFilter
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo ln -sfn /Applications/Xcode_27.1.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate
        working-directory: apple
        run: xcodegen generate -q
      - name: Plain-fixture journeys, iPad
        run: |
          log="$RUNNER_TEMP/mock_service_history.log"
          python3 tools/mock_service.py --port 0 > "$log" 2>&1 &
          for _ in $(seq 60); do grep -q "fixture service on" "$log" && break; sleep 1; done
          port=$(sed -n 's/.*fixture service on 127\.0\.0\.1:\([0-9]*\).*/\1/p' "$log" | head -n 1)
          export TEST_RUNNER_FST_FIXTURE_URL="http://127.0.0.1:$port"
          ipad=$(python3 tools/ios_sim.py ci-device --type "iPad Pro 11-inch (M5)")
          python3 tools/mock_service.py --large-catalogue > "$RUNNER_TEMP/mock.log" 2>&1 &
          probe() {
            [ "${{ matrix.variant }}" = probe ] || return 0
            if python3 tools/ios_sim.py uitest --device "$ipad" --app phone --timeout 1500 --no-test-diagnostics \
              --only GroupedCardAccessibilityJourneyTests/testLeaderboardsGroupedCardIsReadableAtAX5; then
              echo "BISECT $1: PASS" | tee -a "$RUNNER_TEMP/bisect.txt"
            else
              echo "BISECT $1: FAIL" | tee -a "$RUNNER_TEMP/bisect.txt"
            fi
          }
          probe start
          for journey in $PLAIN; do
            python3 tools/ios_sim.py uitest --app ipad --device "$ipad" --fail-on-skip --retries 1 --timeout 1500 \
              --batch-size 1 --no-test-diagnostics --only "$journey" || true
            probe "after-${journey#*/}"
          done
          if [ "${{ matrix.variant }}" = reboot ]; then python3 tools/ios_sim.py shutdown --device "$ipad"; fi
      - name: GroupedCard (phone bundle) with diagnostics
        run: |
          device=$(python3 tools/ios_sim.py ci-device --type "iPad Pro 11-inch (M5)")
          for _ in $(seq 60); do grep -q "fixture service on" "$RUNNER_TEMP/mock.log" && break; sleep 1; done
          export FST_UITEST_KEEP_RESULTS=1
          python3 tools/ios_sim.py uitest --device "$device" --app phone --batch-size 1 --fail-on-skip --retries 1 \
            --timeout 1500 --only GroupedCardAccessibilityJourneyTests/testLeaderboardsGroupedCardIsReadableAtAX5
      - name: Collect
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/bisect.txt" "$RUNNER_TEMP/out/" 2>/dev/null || true
          for r in apple/DerivedData/*/Results/*.xcresult; do
            b="$(basename "$(dirname "$(dirname "$r")")")-$(basename "$r")"
            [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path "$RUNNER_TEMP/out/$b-att" || true
            [ -d "$r" ] && xcrun xcresulttool get test-results tests --path "$r" > "$RUNNER_TEMP/out/$b.tests.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-675-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
