name: native
# Windows and Android unit tests, the Windows accessibility journeys (windows-ui), plus the Android connected
# @DeviceCi journeys on an emulator (the Apple builds run on the Mac through tools/lane_integrate.sh).
on:
  push:
    branches: [master, report/415-windows]
    paths:
      - 'windows/**'
      - 'android/**'
      - 'tools/**'
      - 'contracts/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'android/**'
      - 'tools/**'
      - 'contracts/**'
      - '.github/workflows/native.yml'
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Windows tool tests
        run: python -m unittest discover -s tools/windows/tests
      - name: Android tool tests
        run: python -m unittest discover -s tools/android/tests
      - name: Windows Core unit tests and coverage gate
        shell: pwsh
        run: ./tools/windows/test.ps1 -Coverage
  windows-ui:
    # Accessibility journeys listed in tools/windows/journeys/ci-ui.json, run by a11y_matrix.py (via ci_ui.py)
    # against the Debug app on the runner's desktop session: UIA names, roles, heading levels, focus and reading
    # order, target sizes and Axe.Windows scans at 100% and 225% text. The app talks only to the loopback fixture
    # service (no public service calls). The runner is single-tenant, so the host desktop lock is uncontended.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Windows Python defaults to cp1252 for console and text files; the tools print and write UTF-8.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Display resolution
        # Hosted runners start at 1024x768, which clamps the wide (1440x900) preset; ask for 1080p and log the result.
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { Write-Warning "Set-DisplayResolution unavailable: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen | Format-List Bounds, WorkingArea
          "session $((Get-Process -Id $PID).SessionId)"
      - name: Build app (Debug)
        shell: pwsh
        run: ./tools/windows/build.ps1
      - name: Accessibility journeys (a11y_matrix)
        run: python tools/windows/ci_ui.py --out "${{ runner.temp }}/windows-ui"
      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-results
          path: ${{ runner.temp }}/windows-ui
          if-no-files-found: ignore
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests
        # gradlew is committed without the executable bit (Windows hosts), so run it through bash.
        run: bash android/gradlew -p android testDebugUnitTest --no-daemon
      - name: Licenses manifest is current
        run: python3 tools/android/licenses.py --check
  android-device:
    # Connected accessibility journeys opted in with @DeviceCi (androidTest/.../journeys/DeviceCi.kt),
    # on one fresh emulator per run against FakeTransport fixtures: no network, no service calls.
    # This is the CI form of `device.py test`; the host emulator lock it takes is not needed on a
    # single-tenant runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: bash android/gradlew -p android assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Connected @DeviceCi journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # AOSP image: Google APIs images update Play/GMS packages after boot, and the resulting
          # input reconfiguration recreated the test activity mid-journey (dropping setContent).
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # One command per line (the runner execs each separately). Wake, unlock and clear system
          # dialogs so the first test owns a resumed, focused window; dump logcat on failure.
          script: |
            adb shell svc power stayon true
            adb shell wm dismiss-keyguard
            adb shell input keyevent 82
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            sleep 20
            mkdir -p android/app/build/outputs/androidTest-results/connected
            bash android/gradlew -p android connectedDebugAndroidTest --no-daemon --console=plain -Pandroid.testInstrumentationRunnerArguments.annotation=com.festivalscoretracker.android.journeys.DeviceCi || (adb logcat -d > android/app/build/outputs/androidTest-results/connected/logcat.txt; exit 1)
      - name: Upload connected test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports
          path: |
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
