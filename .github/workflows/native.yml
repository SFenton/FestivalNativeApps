name: native
# Windows and Android unit tests (Android device tests: android-device.yml and android-fold.yml)
# (the Apple builds run on the Mac through tools/lane_integrate.sh).
on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - 'android/**'
      - 'tools/**'
      - 'contracts/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'android/**'
      - 'tools/**'
      - 'contracts/**'
      - '.github/workflows/native.yml'
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Windows tool tests
        run: python -m unittest discover -s tools/windows/tests
      - name: Android tool tests
        run: python -m unittest discover -s tools/android/tests
      - name: Windows Core unit tests and coverage gate
        shell: pwsh
        run: ./tools/windows/test.ps1 -Coverage
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android unit tests
        # gradlew is committed without the executable bit (Windows hosts), so run it through bash.
        run: bash android/gradlew -p android testDebugUnitTest --no-daemon
      - name: Licenses manifest is current
        run: python3 tools/android/licenses.py --check