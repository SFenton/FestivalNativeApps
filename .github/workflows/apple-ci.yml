name: apple-ci
# Apple unit tests, compile check and iOS accessibility journeys on a GitHub-hosted Xcode 27 runner (no mesh machine runs CI or
# release work). The job name is the required check name: keep it `apple-ci`.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  apple-ci:
    name: apple-ci
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Toolchain
        # The image defaults to Xcode 27.0; the app needs the iOS 27.1 SDK (same Xcode build as the Mac). Repoint
        # the image's /Applications/Xcode.app alias so every DEVELOPER_DIR pin in tools/ keeps working.
        run: |
          test -L /Applications/Xcode.app
          sudo ln -sfn /Applications/Xcode_27.1.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate -q
      - name: Release tool tests
        run: python3 -m unittest discover -s tools/release/tests -t .
      - name: Build the iOS app (simulator SDK, compile only)
        # `build` compiles for the generic simulator destination and never boots a simulator.
        run: python3 tools/ios_sim.py build
      - name: Render capture directory
        # Hosted render tests write their captures here; they are uploaded when a test fails.
        run: |
          mkdir -p "$RUNNER_TEMP/renders"
          for v in BANDS COMPETE DUO FILTER FIRST_RUN HISTORY LEADERBOARDS LICENSES PATH PROFILE RIVALS SECTION_INDEX SETTINGS SHELL SHOP SONG_ROW SONGS SORT SUGGESTIONS WHATS_NEW; do echo "FST_${v}_RENDER_OUT=$RUNNER_TEMP/renders" >> "$GITHUB_ENV"; done
      - name: Swift unit tests (macOS host, no simulator)
        working-directory: apple
        run: swift test --parallel --enable-code-coverage
      - name: Animation-evidence tests, alone
        # Their evidence is rendered animation frames (#327). The parallel bundle starves the shared main actor, so
        # there they end at their 10 s evidence deadline as intermittent known issues; alone they are judged
        # strictly. Reuses the coverage build and leaves its profile alone. Filter: testing/apple/hosted-snapshots.md.
        working-directory: apple
        run: swift test --skip-build --filter 'selectedRowRevealFadesTheRowItReaches|staggeredListRowsFadeInRatherThanPop'
      - name: iOS accessibility journeys (simulator, large fixture)
        # Device checks the macOS-hosted tests cannot make: Dynamic Type, the device accessibility tree, hit testing
        # and performAccessibilityAudit (#391). Each journey runs as is, with Increase Contrast and with Reduce
        # Transparency. The runner's own simulator (`ci-device`) and the loopback fixture are never shared;
        # `--require-run` fails a skipped or empty run. List: testing/apple/accessibility.md "In CI".
        env:
          FST_CI_IOS_A11Y_JOURNEYS: >-
            SongsChromeJourneyTests/testSectionBarFadeAtLargestTextKeepsRowsNamedAndPassesTheAudit
        run: |
          python3 tools/mock_service.py --large-catalogue > "$RUNNER_TEMP/mock_service.log" 2>&1 &
          for _ in $(seq 60); do grep -q "Local test fixture service" "$RUNNER_TEMP/mock_service.log" && break; sleep 1; done
          grep -q "Local test fixture service" "$RUNNER_TEMP/mock_service.log" || { cat "$RUNNER_TEMP/mock_service.log"; exit 1; }
          UDID=$(python3 tools/ios_sim.py ci-device)
          ONLY=(); for journey in $FST_CI_IOS_A11Y_JOURNEYS; do ONLY+=(--only "$journey"); done
          for mode in default increase-contrast reduce-transparency; do
            A11Y=(); [ "$mode" = default ] || A11Y=(--a11y "$mode")
            echo "::group::iOS accessibility journeys ($mode)"
            FST_UITEST_KEEP_RESULTS=1 python3 tools/ios_sim.py uitest --device "$UDID" --require-run --timeout 900 \
              "${A11Y[@]}" "${ONLY[@]}"
            echo "::endgroup::"
          done
      - name: Upload iOS journey results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ci-ios-journeys
          path: apple/DerivedData/*/Results/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload hosted render captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ci-renders
          path: ${{ runner.temp }}/renders
          retention-days: 7
      - name: Coverage report (informational; gates are not met yet, see testing/apple/coverage.md)
        continue-on-error: true
        run: |
          PRODUCTS="$GITHUB_WORKSPACE/apple/.build/out/Products/Debug"
          xcrun llvm-cov export \
            "$PRODUCTS/FestivalCoreTests.xctest/Contents/MacOS/FestivalCoreTests" \
            --object="$PRODUCTS/FestivalDesignTests.xctest/Contents/MacOS/FestivalDesignTests" \
            --object="$PRODUCTS/FestivalUITests.xctest/Contents/MacOS/FestivalUITests" \
            --instr-profile="$PRODUCTS/codecov/default.profdata" --format=text \
            > "$PRODUCTS/codecov/FestivalApple-merged.json"
          python3 tools/coverage_gate.py --language swift --report "$PRODUCTS/codecov/FestivalApple-merged.json"
      - name: Product inventory (informational; --strict fails until every control is certified)
        continue-on-error: true
        run: python3 tools/verify_product.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ci-coverage
          path: apple/.build/out/Products/Debug/codecov/*.json
          if-no-files-found: ignore
          retention-days: 14
