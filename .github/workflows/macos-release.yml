name: macos-release
# DISABLED SCAFFOLD. Runs only on manual dispatch and only when the repository variable
# FST_RELEASE_MACOS_ENABLED is 'true'. See .agents/workflow/release-machine.md.
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "macos/vYYMM.DD.NN tag created by version-bump.yml (empty = newest)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  macos-release:
    if: vars.FST_RELEASE_MACOS_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
      # TODO(orchestrator): mirror ios_appstore_build.sh for the FestivalDesktop scheme.
      #   1. Add tools/release/macos_appstore_build.sh (archive `generic/platform=macOS`, a Mac App Store
      #      ExportOptions plist, FST_GIT_SHA stamping, `fst_release.py macos record-build`). Like
      #      ios_appstore_build.sh it checks out `inputs.version_tag`, writes apple/Apps/macOS/WhatsNew.json
      #      from `fst_release.py macos released-versions` and emits macOS-only TestFlight/store notes.
      #   2. Enable CODE_SIGNING_ALLOWED for FestivalDesktop on the command line only.
      #   3. The orchestrator then uses `fst_release.py macos status|submit`, which already
      #      targets ASC platform MAC_OS (bundle id com.sfenton.festivalscoretracker.mac).
      - name: Not implemented
        run: |
          echo "macos-release is a scaffold; implement the TODO steps above first." >&2
          exit 1
