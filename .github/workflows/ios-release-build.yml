name: ios-release-build
# Archive, sign and upload master to App Store Connect (TestFlight processing) on a JIT Mac runner. Submitting
# for review happens only in the store-release workflow (dispatched by the release orchestrator), never locally.
on:
  push:
    branches: [master]
    paths:
      - 'apple/**'
      - 'tools/release/**'
      - 'contracts/**'
      - '.github/workflows/ios-release-build.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the archive/export commands without running them
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-release-build
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  ios-release-build:
    runs-on: ["fst-apple-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Tool paths
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Archive and upload
        shell: bash
        run: |
          set +e
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          tools/release/ios_appstore_build.sh ${args[@]+"${args[@]}"} | tee "$RUNNER_TEMP/build.json"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 4 ]; then
            echo "### ios-release-build: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped: missing signing/ASC credentials on this runner (\`$(cat "$RUNNER_TEMP/build.json")\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "### ios-release-build" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$(cat "$RUNNER_TEMP/build.json")\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Build marker
        id: marker
        if: success()
        shell: bash
        run: |
          # store-release runs on hosted runners without this Mac's ledger; the marker artifact's run head SHA
          # maps the uploaded build number to its commit (fst_release.artifact_head_sha).
          last=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/build.json" | tail -n 1)
          build=$(printf '%s' "$last" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["build"] if d.get("built") and not d.get("dry_run") else "")' 2>/dev/null || true)
          if [ -n "$build" ]; then
            mkdir -p "$RUNNER_TEMP/marker" && printf '%s\n' "$last" > "$RUNNER_TEMP/marker/build.json"
            echo "name=fst-ios-build_$build" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload build marker
        if: success() && steps.marker.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/marker/build.json
          retention-days: 90
      - name: Upload dSYMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms
          path: build/release-ios/FestivalMobile.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30
