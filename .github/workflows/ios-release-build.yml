name: ios-release-build
# Archive, sign and upload one `ios/v<YYMM.DD.NN>` version tag to App Store Connect (TestFlight processing) on a
# GitHub-hosted Xcode 27 runner. Only version-bump.yml (an app change merged to master) or the store-release
# stale-What's-New rebuild dispatches it; there is no push trigger. The build generates the in-app What's New
# from App Store Connect's released versions, and the testflight-notes job sets the build's "What to Test".
# Signing material comes only from the `store-release` environment secrets (master-only) and lives in an ephemeral
# keychain that is deleted after the job. Submitting for review happens only in the store-release workflow
# (dispatched by the release orchestrator); nothing builds, signs or uploads on a mesh machine.
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Version tag to build (ios/vYYMM.DD.NN); empty = the newest ios/v* tag
        type: string
        default: ''
      rebuild_reason:
        description: Why an already-built version is rebuilt (shown in the TestFlight notes)
        type: string
        default: ''
      dry_run:
        description: Print the archive/export commands without running them
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-release-build
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  ios-release-build:
    # The store-release environment only admits master; the tag itself is checked out below.
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    environment: store-release
    timeout-minutes: 90
    outputs:
      build: ${{ steps.marker.outputs.build }}
      marker: ${{ steps.marker.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          fetch-tags: true
      - name: Version tag
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
        run: |
          set -euo pipefail
          tag="${VERSION_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(python3 tools/release/versioning.py latest-tag --platform ios | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"] or "")')
          fi
          if ! printf '%s' "$tag" | grep -Eq '^ios/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::invalid or missing ios version tag '$tag' (run version-bump first)"; exit 2
          fi
          reason=$(printf '%s' "${REBUILD_REASON:-}" | tr -cd 'A-Za-z0-9_ .-' | cut -c1-80)
          git -c advice.detachedHead=false checkout -q "refs/tags/$tag"
          { echo "FST_VERSION_TAG=$tag"; echo "FST_REBUILD_REASON=$reason"; } >> "$GITHUB_ENV"
          echo "Building $tag at $(git rev-parse HEAD)${reason:+ (rebuild: $reason)}"
      - name: Toolchain
        # App Store Connect accepts only released Xcode/SDKs: archive with Xcode 27.0 (27A266a). Xcode 27.1 is beta,
        # so ios_appstore_build.sh compiles out the iOS 27.1 Duo APIs. Switch to Xcode_27.1.app once it ships.
        # Repoint the /Applications/Xcode.app alias so every DEVELOPER_DIR pin in tools/ keeps working.
        run: |
          test -L /Applications/Xcode.app
          sudo ln -sfn /Applications/Xcode_27.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Signing material (ephemeral)
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          # Missing secrets are not an error: ios_appstore_build.sh then reports `missing_signing` (exit 4, skipped).
          set -euo pipefail
          sec="$RUNNER_TEMP/fst-signing"
          mkdir -p "$sec" && chmod 700 "$sec"
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$sec/AuthKey.p8"
            chmod 600 "$sec/AuthKey.p8"
            { echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; echo "ASC_KEY_PATH=$sec/AuthKey.p8"; } >> "$GITHUB_ENV"
          fi
          if [ -n "$IOS_DIST_P12_BASE64" ]; then
            kc="$RUNNER_TEMP/fst-signing.keychain-db"
            kcpw="$(openssl rand -hex 24)"
            echo "::add-mask::$kcpw"
            printf '%s' "$kcpw" > "$sec/keychain-password" && chmod 600 "$sec/keychain-password"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$sec/dist.p12"
            security import "$sec/dist.p12" -k "$kc" -f pkcs12 -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
            rm -f "$sec/dist.p12"
            { echo "FST_SIGNING_KEYCHAIN=$kc"; echo "FST_SIGNING_KEYCHAIN_PASSWORD_FILE=$sec/keychain-password"; } >> "$GITHUB_ENV"
          else
            # No distribution certificate secret: let xcodebuild use cloud-managed signing via the (Admin) ASC key.
            echo "FST_ALLOW_CLOUD_SIGNING=1" >> "$GITHUB_ENV"
          fi
      - name: Revoke CI development certificates (before)
        if: env.FST_ALLOW_CLOUD_SIGNING == '1' && env.ASC_KEY_PATH != '' && inputs.dry_run != true
        continue-on-error: true
        shell: bash
        run: |
          # Cloud-signed archives create a development certificate per hosted runner; revoke API-created ones so
          # the account never reaches Apple's certificate limit (fst_release.prune_ci_certs keeps personal ones).
          # Use the workflow commit's client (master), not the checked-out version tag's, which may predate it.
          git show "$GITHUB_SHA:tools/release/fst_release.py" > "$RUNNER_TEMP/fst_release_ci.py"
          python3 "$RUNNER_TEMP/fst_release_ci.py" ios prune-ci-certs | tee "$RUNNER_TEMP/prune.json"
          echo "Revoke CI development certificates (before): \`$(cat "$RUNNER_TEMP/prune.json")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive and upload
        shell: bash
        run: |
          set +e
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          tools/release/ios_appstore_build.sh ${args[@]+"${args[@]}"} | tee "$RUNNER_TEMP/build.json"
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 4 ]; then
            echo "### ios-release-build: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped: missing signing/ASC secrets in the store-release environment (\`$(cat "$RUNNER_TEMP/build.json")\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "### ios-release-build" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$(cat "$RUNNER_TEMP/build.json")\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Build marker
        id: marker
        if: success()
        shell: bash
        run: |
          # store-release runs on a separate hosted runner without this job's ledger; the marker artifact's run head SHA
          # maps the uploaded build number to its commit (fst_release.artifact_head_sha).
          last=$(grep -v '^[[:space:]]*$' "$RUNNER_TEMP/build.json" | tail -n 1)
          # It also carries the generated store/TestFlight notes and the What's New baseline that store-release checks.
          build=$(printf '%s' "$last" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["build"] if d.get("built") and not d.get("dry_run") else "")' 2>/dev/null || true)
          if [ -n "$build" ]; then
            mkdir -p "$RUNNER_TEMP/marker" && printf '%s\n' "$last" > "$RUNNER_TEMP/marker/build.json"
            { echo "name=fst-ios-build_$build"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Upload build marker
        if: success() && steps.marker.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.marker.outputs.name }}
          path: ${{ runner.temp }}/marker/build.json
          retention-days: 90
      - name: Upload dSYMs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms
          path: build/release-ios/FestivalMobile.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30
      - name: Revoke CI development certificates (after)
        if: always() && env.FST_ALLOW_CLOUD_SIGNING == '1' && env.ASC_KEY_PATH != '' && inputs.dry_run != true
        continue-on-error: true
        shell: bash
        run: |
          # Cloud-signed archives create a development certificate per hosted runner; revoke API-created ones so
          # the account never reaches Apple's certificate limit (fst_release.prune_ci_certs keeps personal ones).
          # Use the workflow commit's client (master), not the checked-out version tag's, which may predate it.
          git show "$GITHUB_SHA:tools/release/fst_release.py" > "$RUNNER_TEMP/fst_release_ci.py"
          python3 "$RUNNER_TEMP/fst_release_ci.py" ios prune-ci-certs | tee "$RUNNER_TEMP/prune.json"
          echo "Revoke CI development certificates (after): \`$(cat "$RUNNER_TEMP/prune.json")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/fst-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/fst-signing.keychain-db" || true
          fi
          rm -rf "$RUNNER_TEMP/fst-signing"

  testflight-notes:
    # Sets the uploaded build's TestFlight "What to Test" once App Store Connect has registered it. Runs on a cheap
    # Linux runner because processing can take tens of minutes.
    needs: ios-release-build
    if: needs.ios-release-build.outputs.build != ''
    runs-on: ubuntu-latest
    environment: store-release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios-release-build.outputs.marker }}
          path: ${{ runner.temp }}/marker
      - name: Set What to Test
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD: ${{ needs.ios-release-build.outputs.build }}
        run: |
          set -euo pipefail
          sec="$RUNNER_TEMP/fst-asc"
          mkdir -p "$sec" && chmod 700 "$sec"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$sec/AuthKey.p8" && chmod 600 "$sec/AuthKey.p8"
          export ASC_KEY_PATH="$sec/AuthKey.p8"
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["testflight_notes"])' "$RUNNER_TEMP/marker/build.json" \
            | python3 tools/release/fst_release.py ios beta-notes --build "$BUILD" --notes-stdin --wait 2700 \
            | tee "$RUNNER_TEMP/beta-notes.json"
          echo "### TestFlight notes: build $BUILD" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cat "$RUNNER_TEMP/beta-notes.json")\`" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$sec"
