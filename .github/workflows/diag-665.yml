name: diag-665
# TEMPORARY diagnostic for #665 (reverted before the fix lands): the Settings switch-tap journey with a touch
# logger, and the iPad full-keyboard-access idle probe, on the hosted xcode-27 runner.
on:
  push:
    branches: [report/665]
    paths: ['.github/workflows/diag-665.yml']
permissions:
  contents: read
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  iphone:
    if: ${{ false }}
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo ln -sfn /Applications/Xcode_27.1.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate
        working-directory: apple
        run: xcodegen generate -q
      - name: Settings batch alone
        continue-on-error: true
        run: |
          mkdir -p /tmp/fst-665 && chmod 777 /tmp/fst-665
          python3 tools/mock_service.py --large-catalogue > "$RUNNER_TEMP/mock.log" 2>&1 &
          python3 tools/mock_service.py --port 18934 > "$RUNNER_TEMP/mock_bands.log" 2>&1 &
          device=$(python3 tools/ios_sim.py ci-device)
          echo "$device" > "$RUNNER_TEMP/device"
          for _ in $(seq 60); do grep -q "fixture service on" "$RUNNER_TEMP/mock.log" && break; sleep 1; done
          python3 tools/ios_sim.py uitest --device "$device" --timeout 1800 --no-test-diagnostics \
            --only SettingsAccessibilityJourneyTests/testAccessibilityThenItemShopReadInOrder \
            --only SettingsAccessibilityJourneyTests/testAccessibilityThenItemShopReadableAtAX5 \
            --only SettingsVisualOrderAccessibilityJourneyTests/testSongRowVisualOrderIsReadableAtAX5
      - name: Preceding batches then Settings
        continue-on-error: true
        run: |
          echo "=== second pass ===" >> /tmp/fst-665/touch.log || true
          device=$(cat "$RUNNER_TEMP/device")
          python3 tools/ios_sim.py uitest --device "$device" --timeout 1800 --no-test-diagnostics \
            --only NotificationsAccessibilityJourneyTests/testRowsUnderThePinnedTitleKeepTheirAccessibility \
            --only NotificationsAccessibilityJourneyTests/testRowsUnderThePinnedTitleKeepTheirAccessibilityAtAX5 \
            --only SongBandLeaderboardAccessibilityJourneyTests/testBandBoardHeaderIsAccessibleAtStandardSize \
            --only SongBandLeaderboardAccessibilityJourneyTests/testBandBoardHeaderGrowsAtAX5 \
            --only SettingsAccessibilityJourneyTests/testAccessibilityThenItemShopReadInOrder \
            --only SettingsAccessibilityJourneyTests/testAccessibilityThenItemShopReadableAtAX5
      - name: Collect
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R /tmp/fst-665 "$RUNNER_TEMP/out/" || true
          for r in apple/DerivedData/lane-driver/Results/*.xcresult; do
            [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path "$RUNNER_TEMP/out/$(basename "$r")-att" || true
            [ -d "$r" ] && xcrun xcresulttool get test-results tests --path "$r" > "$RUNNER_TEMP/out/$(basename "$r").tests.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-665-iphone
          path: ${{ runner.temp }}/out
  ipad:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo ln -sfn /Applications/Xcode_27.1.app /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate
        working-directory: apple
        run: xcodegen generate -q
      - name: FKA idle probe
        continue-on-error: true
        run: |
          python3 tools/mock_service.py --large-catalogue > "$RUNNER_TEMP/mock.log" 2>&1 &
          device=$(python3 tools/ios_sim.py ci-device --type "iPad Pro 11-inch (M5)")
          for _ in $(seq 60); do grep -q "fixture service on" "$RUNNER_TEMP/mock.log" && break; sleep 1; done
          mkdir -p /tmp/fst-665 && chmod 777 /tmp/fst-665
          export FST_UITEST_KEEP_RESULTS=1
          python3 tools/ios_sim.py uitest --device "$device" --app phone --a11y full-keyboard-access --timeout 2400 \
            --no-test-diagnostics --only ZZFKAProbeTests || true
          python3 tools/ios_sim.py uitest --device "$device" --app phone --a11y full-keyboard-access --timeout 1500 \
            --no-test-diagnostics --only BoardFooterFadeJourneyTests/testBoardKeyboardFocusClearsFooter || true
      - name: Collect
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R /tmp/fst-665 "$RUNNER_TEMP/out/" || true
          cp /var/folders/*/*/T/fst-uitest-log-*.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          for r in apple/DerivedData/lane-driver/Results/*.xcresult; do
            [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path "$RUNNER_TEMP/out/$(basename "$r")-att" || true
            [ -d "$r" ] && xcrun xcresulttool get test-results tests --path "$r" > "$RUNNER_TEMP/out/$(basename "$r").tests.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-665-ipad
          path: ${{ runner.temp }}/out
