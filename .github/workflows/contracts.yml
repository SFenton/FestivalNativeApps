name: contracts
on:
  push:
    branches: [master]
  pull_request:
    # `edited`: Release-Note trailers usually live in the PR description.
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
# A newer push (or description edit) supersedes a PR's older run; master runs are never cancelled.
concurrency:
  group: contracts-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release notes present for app changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 tools/release/versioning.py check-notes --base "$BASE_SHA" --head "$HEAD_SHA" \
            --body-file "$RUNNER_TEMP/pr-body.md"
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 tools/verify_product.py
      - run: python3 tools/parity_backlog.py
      - run: python3 tools/generate_tokens.py --check
      - run: python3 -m tools.contrast_gate
      - run: python3 .agents/_tools/check_docs.py
      - name: Pattern registry and guards
        run: python3 tools/pattern_guard.py
      - name: Patterns touched by this PR (advisory)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/pattern_guard.py changed --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: python3 -m unittest discover -s .agents/_tools
