name: FestivalNativeApple
options:
  createIntermediateGroups: true
packages:
  FestivalApple:
    path: .
targets:
  FestivalMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOS
    dependencies:
      - package: FestivalApple
        product: FestivalUI
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Festival Score Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FSTGitSHA: $(FST_GIT_SHA)
        UILaunchScreen:
          UIColorName: FestivalLaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.festivalscoretracker.native
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        FST_GIT_SHA: dev
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
  FestivalDesktop:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/macOS
    dependencies:
      - package: FestivalApple
        product: FestivalUI
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: Festival Score Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.festivalscoretracker.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
  FestivalMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/iOSUITests
    dependencies:
      - target: FestivalMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.festivalscoretracker.nativeuitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: FestivalMobile
        CODE_SIGNING_ALLOWED: NO
  FestivalDesktopUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/macOSUITests
    dependencies:
      - target: FestivalDesktop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sfenton.festivalscoretracker.macuitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: FestivalDesktop
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  FestivalMobile:
    build:
      targets:
        FestivalMobile: all
    test:
      gatherCoverageData: true
      targets:
        - name: FestivalMobileUITests
  FestivalDesktop:
    build:
      targets:
        FestivalDesktop: all
    test:
      gatherCoverageData: true
      targets:
        - name: FestivalDesktopUITests
